version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
      test-tooling:
        patterns:
          - "github.com/stretchr/*"
          - "github.com/DATA-DOG/*"
          - "github.com/testcontainers/*"
          - "*/testify*"
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/mcpresource"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      mcpresource-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/audit/sinks/otlp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      adapters:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
