name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write      # create GitHub Release and upload assets
  id-token: write      # Sigstore OIDC token for keyless cosign signing
  attestations: write  # SLSA provenance attestations

env:
  GOWORK: off

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for goreleaser changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install syft (SBOM generator)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      # goreleaser invokes `syft` by name (see .goreleaser.yml sboms.cmd), so
      # expose the downloaded binary's directory on PATH for later steps.
      - name: Put syft on PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          dirname "$SYFT_CMD" >> "$GITHUB_PATH"

      - name: Install cosign (Sigstore keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA provenance covers the source archive and SBOM so downstream
      # supply-chain tools can verify the release was produced by this
      # workflow on this exact commit.
      - name: Attest SLSA provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/theauth-go-*.tar.gz
            dist/theauth-go-*.sbom.json

      # Optional Slack notification. The step is skipped automatically when
      # the SLACK_WEBHOOK_URL secret is not set.
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -sSf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"theauth-go ${TAG} released: https://github.com/glincker/theauth-go/releases/tag/${TAG}\"}"
