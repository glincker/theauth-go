name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Branch protection requires the check named "test". The `test` job below aggregates
  # the shards so that name keeps reporting and fails when either shard fails.
  unit:
    if: github.event_name != 'schedule'
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # internal/as alone takes about 200s under -race. Running it as its own shard
        # lets the rest of the module finish in parallel instead of queuing behind it.
        shard: [rest, as]
    permissions:
      contents: read
      # Lets codecov-action authenticate with a GitHub OIDC token when no CODECOV_TOKEN secret is set.
      id-token: write
    env:
      GOWORK: off
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: theauth
          POSTGRES_PASSWORD: pg-${{ github.run_id }}
          POSTGRES_DB: theauth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U theauth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Deliberately unused by any test today: THEAUTH_MYSQL_CONTRACT is not
      # set below, so TestMySQLStoreContract still skips. This container
      # exists so the opt-in gate can be flipped on once MySQL's status
      # against the shared contract suite is verified (see docs/ROADMAP.md).
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: my-${{ github.run_id }}
          MYSQL_DATABASE: theauth_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
      # go vet ./... covers the whole module, so it runs once in the rest shard.
      - name: Vet
        if: matrix.shard == 'rest'
        run: go vet ./...
      - name: Test
        env:
          POSTGRES_TEST_URL: postgres://theauth:pg-${{ github.run_id }}@localhost:5432/theauth_test?sslmode=disable
        run: |
          if [ "${{ matrix.shard }}" = "as" ]; then
            pkgs=(./internal/as/...)
          else
            mapfile -t pkgs < <(go list ./... | grep -Ev '/internal/as(/|$)')
          fi
          go test -race -timeout=300s -coverprofile="coverage-${{ matrix.shard }}.out" "${pkgs[@]}"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage-${{ matrix.shard }}.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # Token wins when the secret exists, otherwise fall back to tokenless OIDC.
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          # Surface upload failures on pushes to main instead of hiding them (a missing token was rejected silently).
          fail_ci_if_error: ${{ github.event_name == 'push' }}
      - name: Bench smoke
        if: matrix.shard == 'rest'
        run: go test -bench=. -benchmem -run=^$ -benchtime=1x ./internal/bench/...

  test:
    # always(): if `unit` fails, this job must still run and fail. A skipped job would report success.
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.unit.result }}
        run: test "$RESULT" = "success"

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./crypto, name: FuzzEncryptDecrypt }
          - { pkg: ./crypto, name: FuzzDecryptArbitrary }
          - { pkg: ./crypto, name: FuzzVerifierToChallenge }
          - { pkg: ./crypto, name: FuzzGenerateCodeVerifier }
          - { pkg: ./crypto, name: FuzzTokenHashRoundTrip }
          - { pkg: ./crypto, name: FuzzBase64URLDecode }
          - { pkg: ./integration, name: FuzzParseSessionCookie }
          - { pkg: ./integration, name: FuzzParseStateCookie }
          - { pkg: ./integration, name: FuzzEmailValidation }
          - { pkg: ./integration, name: FuzzCallbackQueryParams }
          - { pkg: ./integration, name: FuzzCallbackProviderName }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
      - name: Fuzz ${{ matrix.target.name }}
        run: go test -run=^$ -fuzz=^${{ matrix.target.name }}$ -fuzztime=10s ${{ matrix.target.pkg }}

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
      # golangci-lint-action caches ~/.cache/golangci-lint itself. Only new issues vs origin/main fail the job.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=3m --new-from-rev=origin/main

  sqlite:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets codecov-action authenticate with a GitHub OIDC token when no CODECOV_TOKEN secret is set.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go vet ./storage/sqlite/... ./examples/single-binary-sqlite/...
      # storage/sqlite is its own module, so the root coverage run never sees it. Measure it here.
      - run: go test -race -timeout=300s -coverprofile=coverage-sqlite.out ./storage/sqlite/... ./examples/single-binary-sqlite/...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage-sqlite.out
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  # mcpresource is its own module, so the root `go test ./...` never runs it. It validates access tokens for
  # resource servers (JWT, DPoP, introspection, opaque tokens), so it gets its own job and its own coverage.
  mcpresource:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets codecov-action authenticate with a GitHub OIDC token when no CODECOV_TOKEN secret is set.
      id-token: write
    defaults:
      run:
        working-directory: mcpresource
    env:
      # The repo go.work needs Go 1.26. Run the module the way a consumer builds it, at its own 1.25 floor.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race -timeout=300s -coverprofile=coverage-mcpresource.out ./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: mcpresource/coverage-mcpresource.out
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
