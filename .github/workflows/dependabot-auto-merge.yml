name: Dependabot auto-merge

# Enables GitHub native auto-merge (squash) on Dependabot PRs whose updates are
# all patch or minor and touch no security-relevant dependency. GitHub then
# waits for the required checks in branch protection before merging.
#
# Held for review (labeled needs-review): any major bump, and any bump of a
# security-relevant dependency (crypto, JWT, SAML, WebAuthn, TOTP, XML, CBOR).
#
# Never checks out or runs PR code. The classification uses only metadata, and
# the metadata reaches the script through env vars, not shell interpolation.
# Metadata approach from thesvg and levelrail; the major/security hold from levelrail.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    steps:
      - name: Fetch dependency metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        # Grouped PRs carry several updates, so judge every entry, not the
        # summary output. Anything not clearly patch or minor is held.
        run: |
          set -euo pipefail
          sec='^(golang\.org/x/crypto|github\.com/golang-jwt/jwt|github\.com/crewjam/saml|github\.com/russellhaering/goxmldsig|github\.com/go-webauthn/|github\.com/pquerna/otp|github\.com/beevik/etree|filippo\.io/|github\.com/fxamacker/cbor|github\.com/mattermost/xml-roundtrip-validator|github\.com/google/go-tpm)'
          decision=$(jq -r --arg sec "$sec" '
            if any(.[]; (.dependencyName | test($sec))) then "security"
            elif any(.[]; .updateType != "version-update:semver-patch" and .updateType != "version-update:semver-minor") then "major"
            else "merge" end' <<<"$DEPS_JSON")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.decision == 'merge'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label for manual review
        if: steps.decide.outputs.decision != 'merge'
        run: |
          if [ "$DECISION" = "security" ]; then
            reason="a security-relevant dependency (crypto, JWT, SAML, WebAuthn, TOTP or XML parsing)"
          else
            reason="a major version bump"
          fi
          gh label create needs-review --color fbca04 \
            --description "Dependabot bump that needs human review" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label needs-review
          gh pr comment "$PR_URL" --body "This includes $reason. Not auto-merging, read the release notes before shipping it."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECISION: ${{ steps.decide.outputs.decision }}
