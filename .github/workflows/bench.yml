name: bench

# Manual + weekly only. Per-PR runs were burning ~15 min of CI per PR; rare
# regressions caught did not justify the spend. Run on-demand before a
# release, or rely on the Monday 06:00 UTC drift check.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base ref or SHA to diff against (defaults to the previous commit)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write is required by the benchstat-diff comment step on PRs.
# contents: read is the minimum for actions/checkout.
permissions:
  contents: read
  pull-requests: write

env:
  GOWORK: off

jobs:
  bench:
    name: Performance regression gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      THRESHOLD_PCT: 25
      BENCH_TIME: 2s
      BENCH_COUNT: 10
      # BENCH_PIN is intentionally unset by default; GitHub Actions ubuntu
      # runners support taskset but pinning to core 0 can conflict with the
      # runner's own housekeeping work. Enable by setting BENCH_PIN: "1" in
      # repo/environment secrets if you observe high variance.

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth 0 ensures the base ref is reachable for checkout below.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          cache: true

      # Pinned: benchstat at @latest requires Go 1.26 as of 2026-08-19 (x/perf
      # bumped its go directive), which breaks this job on Go 1.25. This is
      # the last x/perf commit whose go.mod still says go 1.25.0. Bump this
      # together with the go-version above.
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@fd4a688df89207abdabe0a0cf5b2cd9ccfd376d2

      # Work out which commit to compare against, once, so the cache key and
      # the base checkout agree.
      #   pull_request: the PR base SHA.
      #   push:         the commit before the push.
      #   dispatch:     the base_sha input, else the previous commit.
      #   schedule:     the newest commit at least 7 days old (weekly drift
      #                 check), else the previous commit.
      # Anything else that resolves to nothing fails the job instead of
      # silently skipping the comparison. The only legitimate skip is the
      # first push of a new branch (all-zero "before" SHA).
      - name: Resolve base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base=""
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            workflow_dispatch)
              if [ -n "${INPUT_BASE}" ]; then
                base="$(git rev-parse --verify "${INPUT_BASE}^{commit}")"
              else
                base="$(git rev-parse --verify HEAD~1)"
              fi
              ;;
            schedule)
              base="$(git rev-list -n 1 --before='7 days ago' HEAD)"
              if [ -z "${base}" ]; then
                base="$(git rev-parse --verify HEAD~1)"
              fi
              ;;
          esac
          if [ "${EVENT_NAME}" = "push" ] && { [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; }; then
            echo "No base SHA available (first push to branch); skipping base run."
            echo "SKIP_DIFF=true" >> "$GITHUB_ENV"
            base="none"
          elif [ -z "${base}" ]; then
            echo "::error::Could not resolve a base commit for ${EVENT_NAME}; refusing to skip the regression check."
            exit 1
          elif [ "${base}" = "${GITHUB_SHA}" ]; then
            echo "::error::Base commit equals HEAD (${base}); nothing to compare. Pass base_sha to pick another commit."
            exit 1
          fi
          echo "Comparing ${GITHUB_SHA} against ${base}"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"

      # Try to restore a cached baseline for the base commit resolved above.
      # It is a fixed SHA, so the cache is stable across re-runs.
      - name: Restore base benchmark cache
        id: cache-base
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: base-bench.txt
          key: bench-baseline-${{ steps.base.outputs.sha }}

      # Save a copy of the gate script and curated list to /tmp before any
      # git checkout so we can run them on the base commit (which does not
      # have scripts/ or benchgate/ yet).
      - name: Stash gate script and curated list for base run
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/benchgate
          cp scripts/bench-gate.sh /tmp/bench-gate.sh
          cp benchgate/curated.txt /tmp/benchgate/curated.txt
          chmod +x /tmp/bench-gate.sh

      # Run benchmarks on the current (PR) branch first, in parallel with the
      # base run below when the cache is cold.
      - name: Run benchmarks on PR branch
        run: ./scripts/bench-gate.sh > pr-bench.txt
        env:
          BENCH_TIME: ${{ env.BENCH_TIME }}
          BENCH_COUNT: ${{ env.BENCH_COUNT }}

      # Run benchmarks on the base branch only when the cache was not hit.
      - name: Checkout base branch
        if: steps.cache-base.outputs.cache-hit != 'true' && env.SKIP_DIFF != 'true'
        run: git checkout "${{ steps.base.outputs.sha }}"

      - name: Run benchmarks on base commit
        if: steps.cache-base.outputs.cache-hit != 'true' && env.SKIP_DIFF != 'true'
        # Use the stashed copy of the script so missing scripts/ on the
        # base commit is not a problem. BENCH_ROOT points to the curated.txt
        # on the PR branch (stashed in /tmp alongside the script). Benchmarks
        # that do not exist on the base commit are silently skipped by go test
        # (no matching -bench pattern).
        # BENCH_ROOT=/tmp so the script finds /tmp/benchgate/curated.txt.
        run: BENCH_ROOT="/tmp" /tmp/bench-gate.sh > base-bench.txt
        env:
          BENCH_TIME: ${{ env.BENCH_TIME }}
          BENCH_COUNT: ${{ env.BENCH_COUNT }}

      - name: Save base benchmark to cache
        if: steps.cache-base.outputs.cache-hit != 'true' && env.SKIP_DIFF != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: base-bench.txt
          key: bench-baseline-${{ steps.base.outputs.sha }}

      # Return to the PR branch before running the diff step (git checkout
      # above moves HEAD).
      - name: Restore PR branch
        if: steps.cache-base.outputs.cache-hit != 'true' && env.SKIP_DIFF != 'true'
        run: git checkout ${{ github.sha }}

      - name: Run benchstat diff
        if: env.SKIP_DIFF != 'true'
        id: benchstat
        run: |
          benchstat base-bench.txt pr-bench.txt | tee diff.txt
          {
            echo "diff_output<<BENCHEOF"
            cat diff.txt
            echo "BENCHEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment benchstat diff on PR
        if: github.event_name == 'pull_request' && env.SKIP_DIFF != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const diff = `${{ steps.benchstat.outputs.diff_output }}`;
            const threshold = process.env.THRESHOLD_PCT;
            const body = [
              '## Benchmark regression report',
              '',
              'Threshold: **' + threshold + '%**',
              '',
              '```',
              diff,
              '```',
              '',
              '_Generated by the bench workflow. A `+` delta means the PR branch is slower._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Benchmark regression report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          THRESHOLD_PCT: ${{ env.THRESHOLD_PCT }}

      - name: Check for regressions
        if: env.SKIP_DIFF != 'true'
        run: ./scripts/bench-gate.sh --check diff.txt
        env:
          THRESHOLD_PCT: ${{ env.THRESHOLD_PCT }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-results-${{ github.sha }}
          path: |
            pr-bench.txt
            base-bench.txt
            diff.txt
          if-no-files-found: ignore
          retention-days: 90
