# .goreleaser.yml
# goreleaser v2.x config for theauth-go (library release, no binary)
# Docs: https://goreleaser.com/customization/
version: 2

project_name: theauth-go

before:
  hooks:
    - go mod tidy
    - go test ./...

# No binaries -- this is a Go library. The stub satisfies goreleaser's
# requirement that at least one build block exists.
builds:
  - skip: true

# Attach a source archive (tar.gz) of the repo at the tag so downstream
# compliance tools and air-gapped consumers have a reproducible snapshot.
source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Tag }}"
  format: tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOM (CycloneDX JSON) generated by syft over the source tree.
# syft must be installed in the runner; the release workflow installs it.
sboms:
  - artifacts: source
    args:
      - "$artifact"
      - "--file"
      - "$document"
      - "--output"
      - "cyclonedx-json"
    cmd: syft
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    id: source-sbom

# Keyless Sigstore/cosign signing via GitHub Actions OIDC.
# Produces a .sig (signature) and .cert (Rekor transparency-log entry)
# file alongside every artifact.
signs:
  - cmd: cosign
    artifacts: all
    output: true
    # Without these two names goreleaser expands ${signature} and ${certificate}
    # to nothing and uploads no .cert, so the verify steps in the release notes
    # cannot work. Names match the commands in release.header below.
    signature: "${artifact}.sig"
    certificate: "${artifact}.cert"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    env:
      - COSIGN_EXPERIMENTAL=1

changelog:
  # Parse changelog from CHANGELOG.md (Keep-a-Changelog format).
  use: github
  sort: asc
  abbrev: -1
  groups:
    - title: "Breaking changes"
      regexp: "^.*!:.*$"
      order: 0
    - title: "New features"
      regexp: "^feat(\\(.*\\))?:"
      order: 1
    - title: "Bug fixes"
      regexp: "^fix(\\(.*\\))?:"
      order: 2
    - title: "Performance"
      regexp: "^perf(\\(.*\\))?:"
      order: 3
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: glincker
    name: theauth-go
  # draft: false means the release goes live immediately on tag push.
  draft: false
  # prerelease: auto detects -alpha, -beta, -rc suffixes.
  prerelease: auto
  # Opens a linked Announcements discussion for every release, built from the notes. The shared monthly
  # release thread is still synced by release-discussion.yml.
  discussion_category_name: Announcements
  name_template: "{{ .Tag }}"
  header: |
    <p align="center">
      <a href="https://theauth.dev">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/glincker/theauth/main/docs/logo/wordmark-dark.svg" />
          <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/glincker/theauth/main/docs/logo/wordmark-light.svg" />
          <img src="https://raw.githubusercontent.com/glincker/theauth/main/docs/logo/wordmark-light.svg" alt="theAuth" height="44" />
        </picture>
      </a>
    </p>

    <p align="center">
      <a href="https://docs.theauth.dev/go/getting-started/overview">Docs</a> &middot;
      <a href="https://pkg.go.dev/github.com/glincker/theauth-go/v2">pkg.go.dev</a> &middot;
      <a href="https://github.com/glincker/theauth-go/blob/main/CHANGELOG.md">Changelog</a> &middot;
      <a href="https://github.com/glincker/theauth/discussions">Discussions</a>
    </p>

    ---

    theauth-go {{ .Tag }}: the Go library for authentication and authorization with OAuth 2.1, MCP, passkeys, SAML, SCIM and DPoP. Self-hosted, MIT licensed.

  footer: |
    **Verify this release**

    ```bash
    # Download the SBOM and its Sigstore signature from the release assets, then:
    cosign verify-blob \
      --certificate-identity "https://github.com/glincker/theauth-go/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      --signature theauth-go-{{ .Tag }}.tar.gz.sbom.json.sig \
      --certificate theauth-go-{{ .Tag }}.tar.gz.sbom.json.cert \
      theauth-go-{{ .Tag }}.tar.gz.sbom.json
    ```

    Use this library: `go get github.com/glincker/theauth-go/v2@{{ .Tag }}`
